# Copy to <workspace>/voicevibe.toml. Every key is also settable as VVC_<KEY>
# in the environment, and command line flags beat both.

[voicevibe]
brain = "auto"             # auto | claude | local
model = "claude-opus-5"    # used by the claude brain
effort = "high"            # low | medium | high | xhigh | max

# The local brain: no API key, no network.
local_model = "qwen2.5-coder:7b"
local_url = "http://localhost:11434"
local_api = "auto"         # auto | ollama | openai (llama.cpp, LM Studio, vLLM)
local_timeout_s = 300

# Listening
whisper_model = "base.en"  # tiny.en is faster; small.en hears better
hangover_ms = 900          # trailing silence that ends an utterance
speech_ratio = 3.5         # how far above the noise floor speech must be
# wake_phrase = "hey vibe" # uncomment to require addressing it by name

# Behaviour
auto_run = true            # run the program after each build
self_heal_attempts = 2     # let it fix its own tracebacks this many times
confirm_destructive = true # "delete x" needs a spoken yes
suggest_improvements = true
idea_bar = 80              # 0-100; ideas scoring lower are never spoken

# Version control
git = true
commit_mode = "auto"       # auto | typed | off
ai_trailer = true
