[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicevibecoder"
version = "0.1.0"
description = "Speak a program into existence: a voice-driven program generator."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Cetta" }]
keywords = ["voice", "speech-recognition", "nlp", "code-generation", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Code Generators",
]
# The core program is standard library only: the grammar, the NLP pipeline, the
# workspace, the runner, and the local brain (which speaks HTTP via urllib).
# Every capability beyond that is an extra, so a phone never builds a Rust
# wheel for a code path it will not run.
dependencies = []

[project.optional-dependencies]
# Thinking with Claude.
claude = ["anthropic>=0.40"]
# Listening on a real microphone, transcribing locally.
voice = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
]
# Spoken responses on desktop (Android uses termux-tts-speak).
speech = ["pyttsx3>=2.90"]
# Everything, the way it runs on a laptop.
all = ["voicevibecoder[claude,voice,speech]"]
dev = ["pytest>=8.0", "ruff>=0.6", "numpy>=1.24", "anthropic>=0.40"]

[project.scripts]
voicevibe = "voicevibecoder.cli:main"

[project.urls]
Repository = "https://github.com/samus0123/voicevibecoder"

[tool.hatch.build.targets.wheel]
packages = ["voicevibecoder"]

[tool.hatch.build.targets.sdist]
include = ["voicevibecoder", "tests", "examples", "voicevibe", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
